# Make sure there are NO spaces before the word 'languages'
languages: ["es", "en"]
default_lang: "es"
exclude_from_localization: ["_data", "_layouts", "assets", "images", "js", "css", "vendor","README.md","Gemfile","Gemfile.lock","incico2.svg"]
parallel_localization: false
timezone: "America/Mexico_City"

polyglot:
  relativize_urls: true

  # Site settings
title: "Incertae Sedis"
email: "contacto@incsed.com"
description: "Incertae Sedis - Transformamos tu visión en realidad digital"
url: "https://incsed.github.io"
baseurl: ""
repository: "incsed/website"
teaser: /assets/images/500x300.png
logo: /assets/images/incico2.svg

# Minimal Mistakes theme
theme: "minimal-mistakes-jekyll"
#remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: default

# Locale
locale: es-MX
#
#languages: ["es", "en"]
#default_lang: "es"
#exclude_from_localization: ["assets", "images", "js", "css"]
#parallel_localization: false

sass:
  implementation: sass-embedded
  sourcemap: never
  sass_dir: _sass
  style: compressed

#polyglot:
 # relativize_urls: true

# Site author
author:
  name: "Incertae Sedis"
  avatar: /assets/images/incico2.svg
  bio: "Servicios de desarrollo web, diseño gráfico y marketing digital para impulsar tu presencia en línea."
  location: "Mexico"
  email: contacto@incsed.com
  links:
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://twitter.com/"
    - label: "Facebook"
      icon: "fab fa-facebook-f"
      url: "https://www.facebook.com/"
    - label: "Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/"

# Footer
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://twitter.com/"
    - label: "Facebook"
      icon: "fab fa-facebook-f"
      url: "https://www.facebook.com/"
    - label: "Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-polyglot
  - jekyll-data

paginate: 5
paginate_path: /page:num/

# Markdown
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Build settings
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - .git
  - .gitignore

# Collections
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/
  services:
    output: true
    permalink: /:collection/:path/

category_archive:
  type: jekyll-archives
  path: /categories/
tag_archive:
  type: jekyll-archives
  path: /tags/
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

#after_footer
after_footer_scripts:
  - /assets/js/script.js